version: "3.9"

services:
  db:
    env_file:
      - .env
    image: postgres
    restart: always
    environment:
      PGDATA: /var/lib/postgresql/data/
      POSTGRES_INITDB_ARGS: "-A md5"
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "5432:5432"
    networks:
      - mynetwork

  redis:
    restart: unless-stopped
    image: redis:7.0.5-alpine
    expose:
      - 6479
    networks:
      - mynetwork

  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - mynetwork

  web:
    restart: unless-stopped
    env_file:
      - .env
    build: .
    entrypoint: /home/TradingApp/web/web-entrypoint.sh
    container_name: trading-application
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/home/TradingApp/web
    ports:
      - "8000:8000"
    depends_on:
      - db
    networks:
      - mynetwork

  worker:
    restart: unless-stopped
    env_file:
      - .env
    build: .
    entrypoint: /home/TradingApp/web/worker-entrypoint.sh
    volumes:
      - .:/home/TradingApp/web
    depends_on:
      - db
      - redis
      - web
    networks:
      - mynetwork

  celery-beat:
    restart: unless-stopped
    env_file:
      - .env
    build: .
    entrypoint: /home/TradingApp/web/celery-beat-entrypoint.sh
    volumes:
      - .:/home/TradingApp/web
    depends_on:
      - db
      - redis
      - web
      - worker
    networks:
      - mynetwork

  flower:
    restart: unless-stopped
    env_file:
      - .env
    image: mher/flower
    container_name: flower
    command: celery flower
    environment:
      FLOWER_PORT: "5555"
    ports:
      - "5555:5555"
    volumes:
      - flower_data:/data
    depends_on:
      - worker
    networks:
      - mynetwork

volumes:
  postgres_data:
  flower_data:

networks:
  mynetwork:
    external: true
